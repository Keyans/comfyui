name: ${COMPOSE_PROJECT_NAME:-comfyui-node}

services:
  comfyui:
    build:
      context: .
      args:
        CUDA_BASE_IMAGE: ${CUDA_BASE_IMAGE:-nvidia/cuda:12.8.1-base-ubuntu22.04}
    image: keyans/comfyui-node:${COMFYUI_REF:-v0.31.0}
    restart: unless-stopped
    runtime: nvidia
    ports:
      - "${COMFYUI_PORT:-8288}:8188"
    environment:
      COMFYUI_HOST: 0.0.0.0
      CONTAINER_PORT: 8188
      ENABLE_MANAGER: ${ENABLE_MANAGER:-1}
      NVIDIA_VISIBLE_DEVICES: ${GPU_IDS:-0}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,video
    volumes:
      - ${COMFYUI_MODELS_DIR:-/srv/comfyui/models}:/data/models
      - ${COMFYUI_INPUT_DIR:-/srv/comfyui/input}:/data/input
      - ${COMFYUI_OUTPUT_DIR:-/srv/comfyui/output}:/data/output
      - ${COMFYUI_TEMP_DIR:-/srv/comfyui/temp}:/data/temp
      - ${COMFYUI_USER_DIR:-/srv/comfyui/user}:/data/user
      - ./docker/extra_model_paths.yaml:/opt/config/extra_model_paths.yaml:ro
      - ./workflows:/opt/shared-workflows:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8188/system_stats', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s
